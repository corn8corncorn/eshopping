<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <title th:text="${isMyOrders != null && isMyOrders ? '我的訂單' : '訂單列表'}">訂單列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: rgba(103,103,103,0.6);
            font-weight: bold;
            color: white;
        }
        .status {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-PENDING { background-color: #ffc107; color: #000; }
        .status-CONFIRMED { background-color: #17a2b8; color: #fff; }
        .status-PROCESSING { background-color: #007bff; color: #fff; }
        .status-SHIPPED { background-color: #6f42c1; color: #fff; }
        .status-DELIVERED { background-color: #28a745; color: #fff; }
        .status-CANCELLED { background-color: #dc3545; color: #fff; }
        .status-RETURNED { background-color: #6c757d; color: #fff; }
        .payment-status {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
        }
        .payment-status-PENDING { background-color: #ffc107; color: #000; }
        .payment-status-PAID { background-color: #28a745; color: #fff; }
        .payment-status-FAILED { background-color: #dc3545; color: #fff; }
        .payment-status-REFUNDED { background-color: #6c757d; color: #fff; }
        .btn {
            padding: 6px 12px;
            margin: 2px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }
        .btn-info {
            background-color: #17a2b8;
            color: white;
        }
        .text-right {
            text-align: right;
        }
        .empty-orders {
            text-align: center;
            padding: 40px;
            color: #c99773;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .pagination-info {
            color: #c99773;
            font-weight: bold;
            margin: 0 15px;
        }
        .pagination-btn {
            padding: 8px 16px;
            background-color: #c99773;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            font-weight: 600;
        }
        .pagination-btn:hover:not(.disabled) {
            color: #fbd5ba;
            background-color: #4f3f66;
        }
        .pagination-btn.disabled {
            background-color: rgba(158, 154, 154, 0.3);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            pointer-events: none;
        }
        .pagination-btn.active {
            background-color: #4f3f66;
            color: #fbd5ba;
        }
        .table-container {
            background-color: rgba(103,103,103,0.6);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
        }
        nav {
            color: white;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        nav a:hover {
            color: #fbd5ba;
        }
        .admin-header {
            background-color: rgba(79, 63, 102, 0.9);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }
        .admin-header h1 {
            margin: 0 0 10px 0;
            color: #fbd5ba;
        }
        .filter-section {
            background-color: rgba(103,103,103,0.6);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }
        .filter-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.3);
            background-color: rgba(255,255,255,0.9);
            color: #333;
        }
        .filter-group input {
            min-width: 200px;
        }
        .filter-group select {
            min-width: 150px;
        }
        .btn-primary {
            background-color: #c99773;
            color: white;
        }
        .btn-primary:hover {
            background-color: #4f3f66;
            color: #fbd5ba;
        }
    </style>
</head>
<body>
    <div class="admin-header" th:if="${isMyOrders == null || !isMyOrders}">
        <h1>訂單管理</h1>
        <nav>
            <a th:href="@{/home}">回首頁</a> |
            <a th:href="@{/admin/dashboard}">後台管理</a> |
            <a th:href="@{/products}">商品管理</a> |
            <a th:href="@{/users}">用戶管理</a> |
            <a th:href="@{/orders}">訂單管理</a>
        </nav>
    </div>
    
    <div class="header" th:if="${isMyOrders != null && isMyOrders}">
        <div class="header-content">
            <h1>我的訂單</h1>
            <nav class="nav">
                <a th:href="@{/home}">首頁</a>
                <a th:href="@{/shop}">商品列表</a>
                <a th:href="@{/cart}">購物車</a>
                <a th:href="@{/orders}">所有訂單（管理員）</a>
            </nav>
        </div>
    </div>

    <!-- 訊息提示 -->
    <div th:if="${success}" class="message success" th:text="${success}"></div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <!-- 搜尋和篩選區域（僅管理員訂單列表顯示） -->
    <div class="filter-section" th:if="${isMyOrders == null || !isMyOrders}">
        <form th:action="@{/orders}" method="get" class="filter-form">
            <div class="filter-group">
                <label for="search">搜尋（訂單編號/客戶名稱）</label>
                <input type="text" id="search" name="search" 
                       th:value="${search != null ? search : ''}" 
                       placeholder="輸入訂單編號或客戶名稱">
            </div>
            <div class="filter-group">
                <label for="status">訂單狀態</label>
                <select id="status" name="status">
                    <option value="">全部</option>
                    <option th:each="s : ${orderStatuses}" 
                            th:value="${s.name()}" 
                            th:text="${s.description}"
                            th:selected="${selectedStatus == s.name()}">
                    </option>
                </select>
            </div>
            <div class="filter-group">
                <label for="paymentStatus">付款狀態</label>
                <select id="paymentStatus" name="paymentStatus">
                    <option value="">全部</option>
                    <option th:each="ps : ${paymentStatuses}" 
                            th:value="${ps.name()}" 
                            th:text="${ps.description}"
                            th:selected="${selectedPaymentStatus == ps.name()}">
                    </option>
                </select>
            </div>
            <div class="filter-group">
                <button type="submit" class="btn btn-primary">搜尋</button>
            </div>
            <div class="filter-group" th:if="${search != null && !search.isEmpty() || (selectedStatus != null && !selectedStatus.isEmpty()) || (selectedPaymentStatus != null && !selectedPaymentStatus.isEmpty())}">
                <a th:href="@{/orders}" class="btn btn-primary">清除篩選</a>
            </div>
        </form>
    </div>

    <div th:if="${orders != null and !orders.isEmpty()}">
        <div class="table-container">
            <table>
            <thead>
                <tr>
                    <th>訂單編號</th>
                    <th>訂單日期</th>
                    <th th:if="${isMyOrders == null || !isMyOrders}">客戶</th>
                    <th>訂單狀態</th>
                    <th>付款狀態</th>
                    <th>付款方式</th>
                    <th class="text-right">訂單金額</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td>
                        <strong th:text="${order.orderNumber}">訂單編號</strong>
                    </td>
                    <td>
                        <span th:if="${order.createdAt != null}" 
                              th:text="${order.createdAt.toString().substring(0, 16).replace('T', ' ')}">訂單日期</span>
                        <span th:if="${order.createdAt == null}">N/A</span>
                    </td>
                    <td th:if="${isMyOrders == null || !isMyOrders}" 
                        th:text="${order.customer != null ? order.customer.fullName : 'N/A'}">客戶</td>
                    <td>
                        <span class="status" 
                              th:classappend="${'status-' + order.status.name()}"
                              th:text="${order.status.description}">訂單狀態</span>
                    </td>
                    <td>
                        <span class="payment-status" 
                              th:classappend="${'payment-status-' + order.paymentStatus.name()}"
                              th:text="${order.paymentStatus.description}">付款狀態</span>
                    </td>
                    <td th:text="${order.paymentMethod != null ? order.paymentMethod.description : 'N/A'}">付款方式</td>
                    <td class="text-right">
                        <strong th:text="${'NT$' + #numbers.formatDecimal(order.finalAmount, 0, 0)}">金額</strong>
                    </td>
                    <td>
                        <a th:href="@{'/orders/' + ${order.id}}" class="btn btn-primary">查看詳情</a>
                        <span th:if="${(isMyOrders != null && isMyOrders) && order.status.name() == 'PENDING'}">
                            <form th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-primary" 
                                        onclick="return confirm('確定要取消此訂單嗎？')">取消訂單</button>
                            </form>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <!-- 分頁導航 -->
        <div class="pagination" th:if="${totalPages != null && totalPages > 1}">
            <!-- 上一頁按鈕 -->
            <a th:href="${isMyOrders != null && isMyOrders ? 
                         '/orders/my?page=' + (currentPage > 0 ? currentPage - 1 : 0) : 
                         '/orders?page=' + (currentPage > 0 ? currentPage - 1 : 0) + 
                         (search != null && !search.isEmpty() ? '&search=' + search : '') + 
                         (selectedStatus != null && !selectedStatus.isEmpty() ? '&status=' + selectedStatus : '') + 
                         (selectedPaymentStatus != null && !selectedPaymentStatus.isEmpty() ? '&paymentStatus=' + selectedPaymentStatus : '')}" 
               class="pagination-btn" 
               th:class="${currentPage == 0 ? 'pagination-btn disabled' : 'pagination-btn'}">
                上一頁
            </a>

            <!-- 頁碼按鈕 -->
            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                <a th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                   th:href="${isMyOrders != null && isMyOrders ? 
                            '/orders/my?page=' + (pageNum - 1) : 
                            '/orders?page=' + (pageNum - 1) + 
                            (search != null && !search.isEmpty() ? '&search=' + search : '') + 
                            (selectedStatus != null && !selectedStatus.isEmpty() ? '&status=' + selectedStatus : '') + 
                            (selectedPaymentStatus != null && !selectedPaymentStatus.isEmpty() ? '&paymentStatus=' + selectedPaymentStatus : '')}"
                   th:class="${(pageNum - 1) == currentPage ? 'pagination-btn active' : 'pagination-btn'}"
                   th:text="${pageNum}">
                </a>
            </div>

            <!-- 下一頁按鈕 -->
            <a th:href="${isMyOrders != null && isMyOrders ? 
                         '/orders/my?page=' + (currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1) : 
                         '/orders?page=' + (currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1) + 
                         (search != null && !search.isEmpty() ? '&search=' + search : '') + 
                         (selectedStatus != null && !selectedStatus.isEmpty() ? '&status=' + selectedStatus : '') + 
                         (selectedPaymentStatus != null && !selectedPaymentStatus.isEmpty() ? '&paymentStatus=' + selectedPaymentStatus : '')}" 
               class="pagination-btn" 
               th:class="${currentPage >= totalPages - 1 ? 'pagination-btn disabled' : 'pagination-btn'}">
                下一頁
            </a>

            <!-- 分頁資訊 -->
            <div class="pagination-info">
                第 <span th:text="${currentPage + 1}"></span> 頁 / 共 <span th:text="${totalPages}"></span> 頁
                <span style="margin-left: 10px;">
                    （共 <span th:text="${totalOrders}"></span> 筆訂單）
                </span>
            </div>
        </div>
    </div>

    <div th:if="${orders == null || orders.isEmpty()}" class="empty-orders">
        <h2>目前沒有訂單</h2>
        <p th:if="${isMyOrders != null && isMyOrders}">
            您還沒有任何訂單，快去選購您喜歡的商品吧！
        </p>
        <p th:if="${isMyOrders == null || !isMyOrders}">
            目前系統中沒有任何訂單。
        </p>
        <a th:href="@{/products}" class="btn btn-primary">前往商品列表</a>
    </div>
</body>
</html>
