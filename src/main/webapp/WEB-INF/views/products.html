<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>商品列表</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url("../../resources/images/bg.jpg");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>商品列表</h1>

  <p><a th:href="@{/products/add}">新增商品</a></p>

  <table border="1" cellpadding="6" cellspacing="0">
    <thead>
      <tr>
        <th>ID</th>
        <th>名稱</th>
        <th>類型</th>
        <th>價格</th>
        <th>狀態</th>
        <th>圖片</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.type}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.status}"></td>
        <td>
          <a th:if="${p.imageUrl}" th:href="${p.imageUrl}" target="_blank">查看圖片</a>
        </td>
        <td>
          <a th:href="@{'/products/edit/' + ${p.id}}">編輯</a>
          <form th:action="@{'/products/delete/' + ${p.id}}" method="post" style="display:inline;">
            <button type="submit">刪除</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <p><a th:href="@{/home}">回首頁</a></p>
</body>
</html>
