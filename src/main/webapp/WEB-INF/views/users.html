<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <script th:src="@{/resources/js/notice.js}"></script>
    <script th:src="@{/resources/js/confirm-modal.js}"></script>
    <title>用戶管理 - 電子商城</title>
</head>
<body>
    <!-- Notice 元件 -->
    <div th:replace="~{fragments/notice :: notice}"></div>

    <div class="container mt-4">
        <h1>用戶列表</h1>
        
        <a th:href="@{/users/add}" class="btn btn-primary mb-3">新增用戶</a>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>使用者名稱</th>
                    <th>Email</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-primary btn-sm">編輯</a>
                        <button type="button" 
                                class="btn btn-primary btn-sm delete-btn" 
                                data-delete-url="@{/users/delete/{id}(id=${user.id})}"
                                th:data-delete-url="@{'/users/delete/' + ${user.id}}"
                                th:data-delete-message="'確定要刪除用戶「' + ${user.username} + '」嗎？'">
                            刪除
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 確認刪除 Modal -->
    <div th:replace="~{fragments/confirm-modal :: confirm-delete-modal}"></div>
</body>
</html>
