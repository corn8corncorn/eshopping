<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('/images/bg.jpg') center/cover;
            opacity: 0.2;
        }
        
        .header h1 {
            position: relative;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            position: relative;
            font-size: 1.2em;
            opacity: 0.95;
        }
        
        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        
        .nav-tabs li {
            flex: 1;
            text-align: center;
        }
        
        .nav-tabs a {
            display: block;
            padding: 20px;
            text-decoration: none;
            color: #495057;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        
        .nav-tabs a:hover {
            background: white;
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .content {
            padding: 40px;
        }
        
        .welcome-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .user-info {
            flex: 1;
        }
        
        .user-info h2 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .user-info p {
            color: #666;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .stat-card h3 {
            color: #495057;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .stat-card .description {
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .recent-orders {
            margin-top: 30px;
        }
        
        .recent-orders h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .order-list {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .order-item {
            display: flex;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            align-items: center;
            transition: background 0.3s;
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .order-item:hover {
            background: #f8f9fa;
        }
        
        .order-info {
            flex: 1;
        }
        
        .order-info h4 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .order-info p {
            color: #666;
            font-size: 0.9em;
        }
        
        .order-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-right: 15px;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-processing {
            background: #d4edda;
            color: #155724;
        }
        
        .status-shipped {
            background: #cfe2ff;
            color: #084298;
        }
        
        .status-delivered {
            background: #d1e7dd;
            color: #0f5132;
        }
        
        .order-amount {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-right: 15px;
        }
        
        .order-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .no-orders {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .no-orders p {
            margin-bottom: 20px;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .action-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .action-card h3 {
            margin-bottom: 10px;
        }
        
        .action-card p {
            opacity: 0.9;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>會員中心</h1>
            <p>歡迎回來！管理您的個人資料、訂單和帳號設定</p>
        </div>
        
        <ul class="nav-tabs">
            <li><a href="/account">總覽</a></li>
            <li><a href="/orders/my">我的訂單</a></li>
            <li><a href="/customers/profile">個人資料</a></li>
            <li><a href="/customers/edit">編輯資料</a></li>
        </ul>
        
        <div class="content">
            <div th:if="${error}" class="error" th:text="${error}"></div>
            
            <div th:if="${customer != null}">
                <!-- 歡迎區塊 -->
                <div class="welcome-section">
                    <div class="avatar" th:text="${customer.fullName != null and !customer.fullName.isEmpty() ? customer.fullName.substring(0, 1) : user.username.substring(0, 1)}"></div>
                    <div class="user-info">
                        <h2 th:text="'你好，' + ${customer.fullName != null and !customer.fullName.isEmpty() ? customer.fullName : user.username}"></h2>
                        <p th:text="'帳號：' + ${user.username}"></p>
                    </div>
                </div>
                
                <!-- 統計資料 -->
                <div class="stats">
                    <div class="stat-card" onclick="location.href='/orders/my'">
                        <h3>總訂單數</h3>
                        <div class="number" th:text="${totalOrders}">0</div>
                        <div class="description">查看所有訂單</div>
                    </div>
                    <div class="stat-card" onclick="location.href='/orders/my?status=PENDING'">
                        <h3>待處理訂單</h3>
                        <div class="number" th:text="${pendingOrders}">0</div>
                        <div class="description">需要處理的訂單</div>
                    </div>
                    <div class="stat-card" onclick="location.href='/cart'">
                        <h3>購物車</h3>
                        <div class="number">📦</div>
                        <div class="description">查看購物車內容</div>
                    </div>
                </div>
                
                <!-- 最近的訂單 -->
                <div class="recent-orders">
                    <h2>最近的訂單</h2>
                    
                    <div class="order-list" th:if="${recentOrders != null and !recentOrders.isEmpty()}">
                        <div class="order-item" th:each="order : ${recentOrders}">
                            <div class="order-info">
                                <h4 th:text="'訂單編號：' + ${order.orderNumber}"></h4>
                                <p th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
                            </div>
                            <div th:class="'order-status status-' + ${order.status.name().toLowerCase()}"
                                 th:text="${order.status.description}"></div>
                            <div class="order-amount" th:text="'$' + ${#numbers.formatDecimal(order.finalAmount, 0, 2)}"></div>
                            <div class="order-actions">
                                <a th:href="@{'/orders/' + ${order.id}}" class="btn btn-primary">查看詳情</a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="no-orders" th:if="${recentOrders == null or recentOrders.isEmpty()}">
                        <p>您還沒有任何訂單</p>
                        <a href="/shop" class="btn btn-primary">立即購物</a>
                    </div>
                </div>
                
                <!-- 快速操作 -->
                <div class="quick-actions">
                    <a href="/shop" class="action-card">
                        <h3>🛍️ 購物</h3>
                        <p>瀏覽商品</p>
                    </a>
                    <a href="/orders/my" class="action-card">
                        <h3>📋 訂單</h3>
                        <p>查看所有訂單</p>
                    </a>
                    <a href="/cart" class="action-card">
                        <h3>🛒 購物車</h3>
                        <p>管理購物車</p>
                    </a>
                    <a href="/customers/edit" class="action-card">
                        <h3>⚙️ 設定</h3>
                        <p>編輯個人資料</p>
                    </a>
                </div>
            </div>
            
            <div th:if="${customer == null}">
                <div class="welcome-section">
                    <div class="user-info">
                        <h2 th:text="'你好，' + ${user.username}"></h2>
                        <p>歡迎來到會員中心！</p>
                    </div>
                </div>
                <div class="no-orders">
                    <p>尚未建立客戶資料，請先完善您的個人資料</p>
                    <a href="/customers/edit" class="btn btn-primary">建立個人資料</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
