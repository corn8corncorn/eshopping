<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首頁</title>
</head>
<body>
    <h1 th:text="#{home.title}">歡迎來到電商網站</h1>
    
    <!-- 登入狀態顯示 -->
    <div th:if="${isLoggedIn}">
        <p th:text="#{message.welcome}">歡迎，<span th:text="${username}"></span>！</p>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" th:text="#{button.logout}">登出</button>
        </form>
    </div>
    
    <div th:unless="${isLoggedIn}">
        <p th:text="#{message.login.required}">請先登入以使用完整功能</p>
        <a th:href="@{/login}" th:text="#{button.login}">登入</a> |
        <a th:href="@{/register}" th:text="#{button.register}">註冊</a>
    </div>
    
    <hr>
    
    <!-- 導航選單 -->
    <nav>
        <a th:href="@{/home}" th:text="#{nav.home}">首頁</a> |
        <a th:href="@{/shop}">商品展示</a> |
        <a th:href="@{/products}" th:text="#{nav.products}">商品管理</a> |
        <a th:href="@{/cart}">購物車</a> |
        <a th:href="@{/orders/my}">我的訂單</a> |
        <a th:href="@{/customers/edit}" th:text="#{nav.edit.profile}">編輯客戶資料</a> |
        <a th:href="@{/customers/profile}" th:text="#{nav.view.profile}">查看客戶資料</a>
        <span th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            | <a th:href="@{/users}" th:text="#{nav.user.management}">用戶管理</a>
            | <a th:href="@{/customers}" th:text="#{nav.customer.management}">客戶管理</a>
            | <a th:href="@{/orders}">訂單管理</a>
        </span>
    </nav>
    
    <hr>
    
    <!-- 語言切換 -->
    <a th:href="@{/?lang=en}" th:text="#{lang.english}">English</a> |
    <a th:href="@{/?lang=zh_TW}" th:text="#{lang.chinese}">繁體中文</a>
</body>
