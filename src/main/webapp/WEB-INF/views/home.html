<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首頁</title>
</head>
<body>
    <h1>歡迎來到電商網站</h1>
    
    <!-- 登入狀態顯示 -->
    <div th:if="${isLoggedIn}">
        <p>歡迎，<span th:text="${username}"></span>！</p>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit">登出</button>
        </form>
    </div>
    
    <div th:unless="${isLoggedIn}">
        <p>請先登入以使用完整功能</p>
        <a th:href="@{/login}">登入</a> |
        <a th:href="@{/register}">註冊</a>
    </div>
    
    <hr>
    
    <!-- 導航選單 -->
    <nav>
        <a th:href="@{/home}">首頁</a> |
        <a th:href="@{/users}">用戶管理</a> |
        <a th:href="@{/products}">商品管理</a>
    </nav>
    
    <hr>
    
    <!-- 語言切換 -->
    <a th:href="@{/?lang=en}">English</a> |
    <a th:href="@{/?lang=zh_TW}">繁體中文</a>
</body>
</html>
