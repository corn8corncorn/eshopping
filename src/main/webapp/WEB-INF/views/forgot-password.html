<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <script th:src="@{/resources/js/notice.js}"></script>
    <title>忘記密碼 - 電子商城</title>
    <script>
        // 表單提交驗證
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form[th\\:action*="/forgot-password"]');
            if (form) {
                form.addEventListener('submit', function(e) {
                    let hasError = false;
                    
                    // 驗證所有必填欄位
                    const requiredInputs = form.querySelectorAll('input[required]');
                    requiredInputs.forEach(input => {
                        let errorDiv = input.parentElement.parentElement.querySelector('.error-message');
                        if (!errorDiv) {
                            // 如果沒有錯誤訊息 div，創建一個
                            errorDiv = document.createElement('div');
                            errorDiv.className = 'error-message';
                            input.parentElement.parentElement.appendChild(errorDiv);
                        }
                        if (!input.value.trim()) {
                            const fieldName = input.parentElement.querySelector('label').textContent.replace('：', '').trim();
                            // 如果沒有後端錯誤訊息，顯示前端驗證訊息
                            if (!errorDiv.hasAttribute('th:if') || errorDiv.textContent.trim() === '') {
                                errorDiv.textContent = '尚未輸入' + fieldName;
                                errorDiv.style.display = 'block';
                            }
                            hasError = true;
                        } else if (!errorDiv.hasAttribute('th:if')) {
                            // 如果有輸入且沒有後端錯誤，隱藏錯誤訊息
                            errorDiv.textContent = '';
                            errorDiv.style.display = 'none';
                        }
                    });
                    
                    if (hasError) {
                        e.preventDefault();
                    }
                });
                
                // 輸入時清除錯誤訊息
                const inputs = form.querySelectorAll('input');
                inputs.forEach(input => {
                    input.addEventListener('input', function() {
                        const errorMsg = this.parentElement.parentElement.querySelector('.error-message');
                        if (errorMsg && this.value.trim() && !errorMsg.hasAttribute('th:if')) {
                            errorMsg.textContent = '';
                            errorMsg.style.display = 'none';
                        }
                    });
                });
            }
        });
    </script>
</head>
<body>
    <!-- Notice 元件 -->
    <div th:replace="~{fragments/notice :: notice}"></div>

    <!-- Logo - 頁面中央上方 -->
    <!--
    <div class="page-logo-container">
        <a th:href="@{/home}">
            <img th:src="@{/resources/images/logo.png}" alt="logo" class="page-logo">
        </a>
    </div>
    -->

    <!-- 忘記密碼表單 -->
    <div class="login-row">
        <div class="loginRegForm">
            <div class="home-icon-top-right">
                <a th:href="@{/home}" class="home-icon" title="返回首頁">
                    <span>🏠</span>
                </a>
            </div>
            <h2>忘記密碼</h2>
            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <div class="input-row">
                        <label for="email">電子郵件：</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label for="username">使用者名稱：</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label></label>
                        <div style="display: flex; justify-content: space-between; width: 200px;">
                            <button type="submit" class="btn btn-primary">驗證身份</button>
                            <a th:href="@{/login}">
                                <button type="button" class="btn btn-primary">返回登入</button>
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
