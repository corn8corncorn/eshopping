<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <title>登入 - 電子商城</title>
    <script>
        // 表單提交驗證
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form[th\\:action*="/login"]');
            if (form) {
                form.addEventListener('submit', function(e) {
                    let hasError = false;
                    
                    // 驗證使用者名稱
                    const usernameInput = document.getElementById('username');
                    let usernameErrorDiv = usernameInput.parentElement.parentElement.querySelector('.error-message');
                    if (!usernameErrorDiv) {
                        // 如果沒有錯誤訊息 div，創建一個
                        usernameErrorDiv = document.createElement('div');
                        usernameErrorDiv.className = 'error-message';
                        usernameInput.parentElement.parentElement.appendChild(usernameErrorDiv);
                    }
                    if (!usernameInput.value.trim()) {
                        // 如果沒有後端錯誤訊息，顯示前端驗證訊息
                        if (!usernameErrorDiv.hasAttribute('th:if') || usernameErrorDiv.textContent.trim() === '') {
                            usernameErrorDiv.textContent = '尚未輸入帳號';
                            usernameErrorDiv.style.display = 'block';
                        }
                        hasError = true;
                    } else if (!usernameErrorDiv.hasAttribute('th:if')) {
                        // 如果有輸入且沒有後端錯誤，隱藏錯誤訊息
                        usernameErrorDiv.textContent = '';
                        usernameErrorDiv.style.display = 'none';
                    }
                    
                    // 驗證密碼
                    const passwordInput = document.getElementById('password');
                    let passwordErrorDiv = passwordInput.parentElement.parentElement.querySelector('.error-message');
                    if (!passwordErrorDiv) {
                        // 如果沒有錯誤訊息 div，創建一個
                        passwordErrorDiv = document.createElement('div');
                        passwordErrorDiv.className = 'error-message';
                        passwordInput.parentElement.parentElement.appendChild(passwordErrorDiv);
                    }
                    if (!passwordInput.value.trim()) {
                        // 如果沒有後端錯誤訊息，顯示前端驗證訊息
                        if (!passwordErrorDiv.hasAttribute('th:if') || passwordErrorDiv.textContent.trim() === '') {
                            passwordErrorDiv.textContent = '尚未輸入密碼';
                            passwordErrorDiv.style.display = 'block';
                        }
                        hasError = true;
                    } else if (!passwordErrorDiv.hasAttribute('th:if')) {
                        // 如果有輸入且沒有後端錯誤，隱藏錯誤訊息
                        passwordErrorDiv.textContent = '';
                        passwordErrorDiv.style.display = 'none';
                    }
                    
                    if (hasError) {
                        e.preventDefault();
                    }
                });
                
                // 輸入時清除錯誤訊息
                const inputs = form.querySelectorAll('input');
                inputs.forEach(input => {
                    input.addEventListener('input', function() {
                        const errorMsg = this.parentElement.parentElement.querySelector('.error-message');
                        if (errorMsg && this.value.trim() && !errorMsg.hasAttribute('th:if')) {
                            errorMsg.textContent = '';
                            errorMsg.style.display = 'none';
                        }
                    });
                });
            }
        });
    </script>
</head>

<body>
    <a th:href="@{/home}" align="center">
        <img th:src="@{/resources/images/logo.png}" alt="logo" style="width: 100px; height: 100px; cursor: pointer;">
    </a>
    <!-- 顯示錯誤訊息 -->
    <div th:if="${error}" th:text="${error}"></div>

    <!-- 顯示成功訊息 -->
    <div th:if="${success}" th:text="${success}"></div>

    <!-- 登入表單和返回首頁 -->
    <div class="login-row">
        <div class="loginRegForm">
            <div class="home-icon-top-right">
                <a th:href="@{/home}" class="home-icon" title="返回首頁">
                    <span>🏠</span>
                </a>
            </div>
            <h2>登入</h2>
            <form th:action="@{/login}" method="post" th:object="${userLoginDTO}">
            <div class="form-group">
                <div class="input-row">
                    <label for="username">使用者名稱：</label>
                    <input type="text" id="username" th:field="*{username}" required>
                </div>
                <div class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <div class="input-row">
                    <label for="password">密碼：</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>
                <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <div class="input-row">
                    <label></label>
                    <div style="display: flex; justify-content: space-between; width: 200px;">
                        <button type="submit" class="btn btn-primary">登入</button>
                        <a th:href="@{/register}">
                            <button type="button" class="btn btn-primary">註冊</button>
                        </a>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="input-row">
                    <label></label>
                    <div style="width: 200px; display: flex; justify-content: center;">
                        <a th:href="@{/forgot-password}">
                            <button type="button" class="btn btn-warning">忘記密碼？</button>
                        </a>
                    </div>
                </div>
            </div>
            <!-- <p>還沒有帳號？ <a th:href="@{/register}">立即註冊</a></p> -->

            <!-- <p><a th:href="@{/forgot-password}">忘記密碼？</a></p> -->
            </form>
        </div>
    </div>
</body>

</html>
