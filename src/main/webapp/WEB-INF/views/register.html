<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <title>註冊 - 電子商城</title>
</head>

<body>
    <!-- 顯示錯誤訊息 -->
    <div th:if="${error}" th:text="${error}"></div>

    <!-- 註冊表單和返回首頁 -->
    <div class="login-row">
        <form class="loginRegForm" th:action="@{/register}" method="post" th:object="${userRegistrationDTO}">
            <h2>註冊</h2>
        <div>
            <label for="username">使用者名稱：</label>
            <input type="text" id="username" th:field="*{username}" required>
            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div>
            <label for="email">電子郵件：</label>
            <input type="email" id="email" th:field="*{email}" required>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div>
            <label for="password">密碼：</label>
            <input type="password" id="password" th:field="*{password}" required>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div>
            <label for="confirmPassword">確認密碼：</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">註冊</button>
            <a th:href="@{/login}">
                <button type="button" class="btn btn-primary">立即登入</button>
            </a>
        </div>
        <!-- <p>已有帳號？ <a th:href="@{/login}">立即登入</a></p> -->
        </form>
        <div class="home-icon-column">
            <a th:href="@{/home}" class="home-icon" title="返回首頁">
                <span>🏠</span>
            </a>
        </div>
    </div>
</body>

</html>
