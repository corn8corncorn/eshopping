<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼 - 電子商城</title>
</head>
<body>
    <h1>重設密碼</h1>
    
    <!-- 顯示使用者名稱 -->
    <p>使用者：<span th:text="${username}"></span></p>
    
    <!-- 顯示錯誤訊息 -->
    <div th:if="${error}" th:text="${error}"></div>
    
    <!-- 重設密碼表單 -->
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="userId" th:value="${userId}">
        
        <div>
            <label for="newPassword">新密碼：</label>
            <input type="password" id="newPassword" name="newPassword" required>
        </div>
        
        <div>
            <label for="confirmPassword">確認密碼：</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        
        <button type="submit" class="btn btn-primary">重設密碼</button>
    </form>
    
    <p><a th:href="@{/login}">返回登入頁面</a></p>
</body>
</html>
