<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <script th:src="@{/resources/js/notice.js}"></script>
    <title>編輯客戶資料 - 電子商城</title>
</head>
<body>
    <!-- Notice 元件 -->
    <div th:replace="~{fragments/notice :: notice}"></div>

    <!-- Logo - 頁面中央上方 -->
    <!--
    <div class="page-logo-container">
        <a th:href="@{/home}">
            <img th:src="@{/resources/images/logo.png}" alt="logo" class="page-logo">
        </a>
    </div>
    -->

    <!-- 編輯客戶資料表單 -->
    <div class="login-row">
        <div class="loginRegForm">
            <div class="home-icon-top-right">
                <a th:href="@{/home}" class="home-icon" title="返回首頁">
                    <span>🏠</span>
                </a>
            </div>
            <h2>編輯客戶資料</h2>
            <form th:action="@{/customers/update}" method="post" th:object="${customer}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{user.id}">
                
                <div class="form-group">
                    <div class="input-row">
                        <label for="username">使用者名稱：</label>
                        <input id="username" type="text" th:value="${customer.user != null ? customer.user.username : ''}" readonly style="background-color: #f5f5f5; color: #666; cursor: default;" />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label for="fullName">姓名：</label>
                        <input id="fullName" type="text" th:field="*{fullName}" required />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label for="phone">電話：</label>
                        <input id="phone" type="text" th:field="*{phone}" 
                               pattern="^09\d{8}$" 
                               placeholder="例如：0912345678"
                               oninput="validatePhone(this)" />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    <div id="phoneError" class="error-message" style="display: none;"></div>
                    <div style="font-size: 0.85em; color: #666; margin-top: 5px;">
                        <span>※ 請輸入10碼手機號碼（09開頭 + 8碼數字，不能有空白或其他符號）</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label for="email">電子郵件：</label>
                        <input id="email" type="email" th:value="${customer.user != null ? customer.user.email : ''}" readonly style="background-color: #f5f5f5; color: #666; cursor: default;" />
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label for="password">新密碼：</label>
                        <input id="password" type="password" th:field="*{user.password}" placeholder="留空則不修改密碼" />
                    </div>
                    <div class="error-message" th:if="${#fields.hasErrors('user.password')}" th:errors="*{user.password}"></div>
                    <div style="font-size: 0.85em; color: #666; margin-top: 5px;">
                        <span>※ 若不修改密碼，請留空</span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-row">
                        <label></label>
                        <div style="display: flex; justify-content: space-between; width: 200px;">
                            <button type="submit" class="btn btn-primary">更新資料</button>
                            <a th:href="@{/customers/profile}">
                                <button type="button" class="btn btn-primary">取消</button>
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function validatePhone(input) {
            const phone = input.value.trim();
            const phoneError = document.getElementById('phoneError');
            const phonePattern = /^09\d{8}$/;
            
            // 如果欄位為空，清除錯誤訊息（因為電話是可選欄位）
            if (phone === '') {
                phoneError.style.display = 'none';
                phoneError.textContent = '';
                input.setCustomValidity('');
                return true;
            }
            
            // 驗證電話格式
            if (!phonePattern.test(phone)) {
                phoneError.style.display = 'block';
                phoneError.textContent = '電話號碼必須以09開頭，後面接8碼數字，共10碼，不能有空白或其他符號';
                input.setCustomValidity('電話號碼格式錯誤');
                return false;
            } else {
                phoneError.style.display = 'none';
                phoneError.textContent = '';
                input.setCustomValidity('');
                return true;
            }
        }
        
        // 表單提交時驗證
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const phoneInput = document.getElementById('phone');
            
            form.addEventListener('submit', function(e) {
                if (!validatePhone(phoneInput)) {
                    e.preventDefault();
                    return false;
                }
            });
        });
    </script>
</body>
</html>
