<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" th:href="@{/resources/css/loginReg.css}">
    <script th:src="@{/resources/js/notice.js}"></script>
    <script th:src="@{/resources/js/confirm-modal.js}"></script>
    <title>購物車</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .cart-summary {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .cart-summary h3 {
            margin-top: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .quantity-input {
            width: 60px;
            padding: 5px;
            text-align: center;
        }
        .btn {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .text-right {
            text-align: right;
        }
        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .actions {
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>
<body>
    <!-- Notice 元件 -->
    <div th:replace="~{fragments/notice :: notice}"></div>

    <div class="header">
        <h1>購物車</h1>
        <nav>
            <a th:href="@{/home}">首頁</a> |
            <a th:href="@{/shop}">商品列表</a> |
            <a th:href="@{/orders/my}">我的訂單</a>
        </nav>
    </div>

    <div th:if="${cartItems != null && !cartItems.isEmpty()}">
        <table>
            <thead>
                <tr>
                    <th>商品名稱</th>
                    <th>單價</th>
                    <th>數量</th>
                    <th>小計</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <strong th:text="${item.productName}">商品名稱</strong><br>
                        <small th:if="${item.product != null}" th:text="${'庫存: ' + item.product.stockQuantity}"></small>
                    </td>
                    <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 2)} + ' 元'">價格</td>
                    <td>
                        <form th:action="@{'/cart/update/' + ${item.product.id}}" method="post" style="display:inline;">
                            <input type="number" name="quantity" th:value="${item.quantity}" 
                                   class="quantity-input" min="1" th:max="${item.product != null ? item.product.stockQuantity : 999}">
                            <button type="submit" class="btn btn-primary">更新</button>
                        </form>
                    </td>
                    <td th:text="${#numbers.formatDecimal(item.subtotal, 0, 2)} + ' 元'">小計</td>
                    <td>
                        <button type="button" 
                                class="btn btn-primary" 
                                th:data-delete-form="'removeForm-' + ${item.product.id}"
                                th:data-delete-message="'確定要移除此商品「' + ${item.productName} + '」嗎？'">
                            移除
                        </button>
                        <form th:id="'removeForm-' + ${item.product.id}" 
                              th:action="@{'/cart/remove/' + ${item.product.id}}" 
                              method="post" 
                              style="display:none;">
                        </form>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3" class="text-right"><strong>總計：</strong></td>
                    <td><strong th:text="${totalAmount != null ? (#numbers.formatDecimal(totalAmount, 0, 2) + ' 元') : '0.00 元'}">總金額</strong></td>
                    <td></td>
                </tr>
                <tr>
                    <td colspan="3" class="text-right"><strong>商品總數：</strong></td>
                    <td><strong th:text="${totalItems != null ? (totalItems + ' 件') : '0 件'}">總數量</strong></td>
                    <td></td>
                </tr>
            </tfoot>
        </table>

        <div class="actions">
            <a th:href="@{/orders/checkout}" class="btn btn-primary">前往結帳</a>
            <form th:action="@{/cart/clear}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-primary" onclick="return confirm('確定要清空購物車嗎？')">清空購物車</button>
            </form>
            <a th:href="@{/shop}" class="btn btn-primary">繼續購物</a>
        </div>
    </div>

    <div th:if="${cartItems == null || cartItems.isEmpty()}" class="empty-cart">
        <h2>購物車是空的</h2>
        <p>快去選購您喜歡的商品吧！</p>
        <a th:href="@{/shop}" class="btn btn-primary">前往商品列表</a>
    </div>

    <!-- 確認刪除 Modal -->
    <div th:replace="~{fragments/confirm-modal :: confirm-delete-modal}"></div>
</body>
</html>
